name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: "28.2.13676358"
  CMAKE_VERSION: "3.22.1"
  KTLINT_VERSION: "1.7.1"

jobs:
  lint-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: gradle/actions/wrapper-validation@v4

      - run: chmod +x gradlew

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}"

      - name: Install host build tools
        run: sudo apt-get update && sudo apt-get install --yes ninja-build

      - name: ktlint
        run: |
          curl --silent --show-error --location --output ktlint \
            "https://github.com/pinterest/ktlint/releases/download/${KTLINT_VERSION}/ktlint"
          chmod +x ktlint
          ./ktlint "**/src/**/*.kt" "**/*.gradle.kts" "*.gradle.kts"

      - name: Android Lint
        run: ./gradlew :app:lintProdDebug

      - name: Kotlin unit tests
        run: ./gradlew test

      - name: C++ unit tests (host)
        run: ./gradlew :engine:hostTest

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/
            **/build/test-results/
